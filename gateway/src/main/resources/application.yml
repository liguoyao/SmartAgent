server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  application:
    name: gateway
  
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:10.18.1.150:31214}
        namespace: ${NACOS_NAMESPACE:3d6b484c-eb6b-4dcb-a6f5-8f5793a0bfce}
      config:
        server-addr: ${NACOS_SERVER:10.18.1.150:31214}
        namespace: ${NACOS_NAMESPACE:3d6b484c-eb6b-4dcb-a6f5-8f5793a0bfce}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
      username: nacos
      password: qiuguo-nacos
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 100
                redis-rate-limiter.burstCapacity: 200
        - id: conversation-service
          uri: lb://conversation-service
          predicates:
            - Path=/api/conversation/**
          filters:
            - StripPrefix=1
        - id: knowledge-service
          uri: lb://knowledge-service
          predicates:
            - Path=/api/knowledge/**
          filters:
            - StripPrefix=1
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/ticket/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

  data:
    redis:
      host: ${REDIS_HOST:r-bp11djv7d4lnne5p6z.redis.rds.aliyuncs.com}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:heMntYjSC3GArYe3hCWGvEEF}
      database: 14
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  datasource:
    url: jdbc:mysql://${DB_HOST:47.111.16.30}:${DB_PORT:13306}/smartagent_gateway?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Qgjh@2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

jwt:
  secret: ${JWT_SECRET:smartagent-secret-key-for-jwt-token-generation-must-be-at-least-256-bits}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.smartagent.gateway: DEBUG
