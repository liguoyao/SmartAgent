server:
  port: 8000

spring:
  application:
    name: smartagent-ai-service
  
  # Redis configuration (optional - falls back to in-memory)
  data:
    redis:
      host: ${REDIS_HOST:r-bp11djv7d4lnne5p6z.redis.rds.aliyuncs.com}
      port: ${REDIS_PORT:6379}
      db: ${REDIS_DB:8}
      password: ${REDIS_PASSWORD:heMntYjSC3GArYe3hCWGvEEF}

# Application configuration
app:
  name: SmartAgent AI Service
  version: 1.0.0
  debug: false
  
  # DeepSeek LLM
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:sk-f85ca8b45ffc410692b6508b3b8c0516}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    max-tokens: 2048
    temperature: 0.7
  
  # Fallback LLM
  fallback:
    api-key: ${FALLBACK_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4-turbo-preview
    max-tokens: 2048
    temperature: 0.7
  
  # Vector store
  vector-store:
    path: ./data/vector_store
    embedding-model: sentence-transformers/all-MiniLM-L6-v2
    top-k: 5
  
  # Redis
  redis:
    host: ${REDIS_HOST:r-bp11djv7d4lnne5p6z.redis.rds.aliyuncs.com}
    port: ${REDIS_PORT:6379}
    db: ${REDIS_DB:9}
    password: ${REDIS_PASSWORD:heMntYjSC3GArYe3hCWGvEEF}
    conversation-ttl: 3600
  
  # Retry
  max-retries: 3

logging:
  level:
    com.smartagent: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"